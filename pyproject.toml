[project]
name = "qustox"
version = "0.1.0"
description = "External factors & sentiment analysis agent for HQRC trading pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Market data (headlines + VIX)
    "yfinance>=0.2.40",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    # OpenAI API (regime classification + sentiment analysis)
    "openai>=1.30.0",
    # Environment variables
    "python-dotenv>=1.0.0",
]
